version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: learning-journey-mongodb-prod
    restart: unless-stopped
    environment:
      # These are derived from MONGO_URI (see env.prod.example)
      # Format: mongodb://username:password@host:port/database?authSource=admin
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password123}
      MONGO_INITDB_DATABASE: learning_journey
    ports:
      - "${MONGO_PORT:-27001}:27017"
    volumes:
      - mongodb_data_prod:/data/db
    networks:
      - learning-journey-prod-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    image: ${DOCKER_IMAGE:-ghcr.io/eclipse-autowrx/learning-journey:latest}
    container_name: learning-journey-app-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
      - PORT=${APP_PORT:-3000}
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - learning-journey-prod-network
    volumes:
      # Single volume for all persistent data
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT:-3000}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data_prod:
  # Single named volume for all app data (certificates, images, files)
  app_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/nhan/dev/learning-journey/deploy/data

networks:
  learning-journey-prod-network:
    driver: bridge
