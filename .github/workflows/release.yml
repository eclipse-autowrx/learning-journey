name: Release Docker Image

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        id: docker_login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set TAG variable
        id: vars
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          GIT_TAG=${GITHUB_REF#refs/tags/}
          TAG="${SHORT_SHA}-${GIT_TAG}"
          echo "TAG=$TAG" >> ${GITHUB_ENV}
          echo "TAG=$TAG"  # output for debug
          echo "::set-output name=TAG::$TAG"  # deprecated but kept for backward compatibility

      - name: Build and optionally push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ steps.docker_login.outcome == 'success' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/learning-journey:${{ env.TAG }}
            ghcr.io/${{ github.repository_owner }}/learning-journey:latest

      - name: Create deployment package
        run: |
          mkdir -p release-assets
          cp deploy/docker-compose.prod.yml release-assets/
          cp deploy/env.prod.example release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-assets/docker-compose.prod.yml
            release-assets/env.prod.example
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Docker Image
            - Image: `ghcr.io/${{ github.repository_owner }}/learning-journey:${{ env.TAG }}`
            - Latest: `ghcr.io/${{ github.repository_owner }}/learning-journey:latest`
            
            ## Deployment Files
            Download the attached files for deployment:
            - `docker-compose.prod.yml` - Docker Compose configuration
            - `env.prod.example` - Environment variables template
            
            See [DEPLOYMENT.md](../blob/main/DEPLOYMENT.md) for deployment instructions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
